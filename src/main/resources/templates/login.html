<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Genesis Gym</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-page">

    <main class="auth-main">
        <div class="auth-card">
            
            <!-- Encabezado con Logo y Marca -->
            <header class="auth-card-header" style="text-align: center; margin-bottom: 24px;">
                <img th:src="@{/images/logo.png}" alt="Genesis Gym" class="gym-logo" style="height: 100px; margin-bottom: 12px;">
                <h2>Genesis</h2>
                <p style="color: var(--color-text-muted); font-size: 0.9rem;">Ingresa a tu cuenta para continuar</p>
            </header>
            
            <!-- Alerta de Error -->
            <div th:if="${Error}" class="alert alert-danger">
                <span th:text="${Error}"></span>
            </div>

            <!-- Alerta de Éxito -->
            <div th:if="${Exito}" class="alert alert-success">
                <span th:text="${Exito}"></span>
            </div>

            <!-- Formulario de Login -->
            <form class="login-form" th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="identificador">Usuario</label>
                    <input type="text" id="identificador" name="identificador" required placeholder="Ingresa tu DNI o Email">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="Tu contraseña">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
            </form>

        </div>
    </main>

</body>
</html>
